<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatGPT Translate</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: linear-gradient(135deg, #0072ff, #00c6ff);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    h1 {
      margin-bottom: 10px;
      font-size: 2rem;
    }
    textarea {
      width: 80%;
      max-width: 600px;
      height: 150px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      resize: none;
    }
    .lang-select {
      margin: 15px 0;
      display: flex;
      gap: 10px;
    }
    input {
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
    }
    button {
      background: #fff;
      color: #0072ff;
      border: none;
      padding: 10px 20px;
      border-radius: 25px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover {
      background: #e0e0e0;
    }
    #output {
      margin-top: 20px;
      width: 80%;
      max-width: 600px;
      background: rgba(255,255,255,0.15);
      padding: 15px;
      border-radius: 8px;
      min-height: 100px;
      white-space: pre-wrap;
    }

.toggle-container {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-bottom: 15px;
}

.switch {
  position: relative;
  display: inline-block;
  width: 50px;
  height: 28px;
}
.switch input {
  opacity: 0;
  width: 0;
  height: 0;
}
.slider {
  position: absolute;
  cursor: pointer;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: #ccc;
  transition: 0.4s;
  border-radius: 34px;
}
.slider:before {
  position: absolute;
  content: "";
  height: 20px;
  width: 20px;
  left: 4px;
  bottom: 4px;
  background-color: white;
  transition: 0.4s;
  border-radius: 50%;
}
input:checked + .slider {
  background-color: #0072ff;
}
input:checked + .slider:before {
  transform: translateX(22px);
}
.toggle-label {
  font-size: 0.95em;
  user-select: none;
}

  </style>
</head>
<body>
  <h1>ChatGPT Translate</h1>
<div class="toggle-container">
  <label class="switch">
    <input type="checkbox" id="redirectToggle" />
    <span class="slider"></span>
  </label>
  <span class="toggle-label">Use Google Translate</span>
</div>

  <textarea id="sourceText" placeholder="Enter text to translate..."></textarea>
  <div class="lang-select">
    <input id="targetLang" placeholder="Target language (e.g., en, es, ko)" />
    <button id="translateBtn">Translate</button>
  </div>
  <div id="output"></div>

  <!-- ✅ external script instead of inline -->
  <script src="translate.js"></script>
</body>
</html>
